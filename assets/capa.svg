<text x="74" y="358" fill="#e2d4e5" font-family="Arial,sans-serif" font-size="24">Menos retrabalho. Mais consistência.</text>
<text x="74" y="395" fill="#e2d4e5" font-family="Arial,sans-serif" font-size="24">Melhores contratações públicas.</text>
<text x="74" y="465" fill="#c5b2ca" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PLANEJAR · ESTRUTURAR · VERIFICAR · EVOLUIR</text>
